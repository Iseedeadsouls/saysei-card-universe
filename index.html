<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SaySei CardUniverse</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #24104a 0%, #10071f 45%, #05030a 100%);
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 430px;
    margin: auto;
    padding: 18px;
}

.header {
    text-align: center;
    margin-bottom: 15px;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 1px;
}

.subtitle {
    color: #a99abb;
    font-size: 12px;
    margin-top: 5px;
}

.balance {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    margin-bottom: 15px;
    font-size: 18px;
    font-weight: bold;
}

.menu {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 18px;
}

.menu button {
    border: none;
    border-radius: 12px;
    padding: 12px 5px;
    color: white;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.menu button.active {
    background: linear-gradient(135deg, #8b3dff, #c03cff);
}

.menu button.inactive {
    background: rgba(255,255,255,0.08);
}

.section {
    display: none;
}

.section.active {
    display: block;
}

/* CARD */

.card {
    position: relative;
    min-height: 430px;
    border-radius: 25px;
    padding: 20px;
    overflow: hidden;
    text-align: center;

    background:
        radial-gradient(circle at 50% 30%, #4a197d, #170b2c 60%, #08050e);

    border: 1px solid rgba(255,255,255,0.15);
    box-shadow:
        0 20px 50px rgba(0,0,0,0.5),
        0 0 35px rgba(143,55,255,0.15);

    transition: transform 0.2s;
}

.card.opening {
    animation: shake 0.18s infinite;
}

@keyframes shake {
    0% { transform: translateX(0) rotate(0); }
    25% { transform: translateX(-5px) rotate(-1deg); }
    50% { transform: translateX(5px) rotate(1deg); }
    75% { transform: translateX(-4px) rotate(-1deg); }
    100% { transform: translateX(0) rotate(0); }
}

.card-art {
    width: 220px;
    height: 220px;
    margin: 15px auto 20px;

    border-radius: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 90px;

    background:
        linear-gradient(145deg, #29124b, #10081d);

    border: 1px solid rgba(255,255,255,0.12);

    box-shadow:
        inset 0 0 40px rgba(0,0,0,0.5),
        0 0 25px rgba(155,60,255,0.15);
}

.card-id {
    color: #8d7c9f;
    font-size: 11px;
}

.rarity {
    display: inline-block;
    margin-top: 7px;
    padding: 5px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    font-size: 11px;
    font-weight: bold;
}

.card-name {
    font-size: 25px;
    font-weight: 900;
    margin-top: 10px;
}

.card-role {
    color: #b5a9c3;
    margin-top: 5px;
}

.card-chance {
    margin-top: 12px;
    color: #8f7fa0;
    font-size: 12px;
}

/* BUTTON */

.open-button {
    width: 100%;
    margin-top: 15px;
    padding: 17px;

    border: none;
    border-radius: 15px;

    background: linear-gradient(135deg, #9b3dff, #d237ff);

    color: white;
    font-size: 17px;
    font-weight: 900;

    cursor: pointer;

    box-shadow: 0 8px 25px rgba(160,50,255,0.25);

    transition: transform 0.15s, opacity 0.15s;
}

.open-button:active {
    transform: scale(0.97);
}

.open-button:disabled {
    opacity: 0.5;
    cursor: default;
}

/* COLLECTION */

.collection-title {
    text-align: center;
    margin-bottom: 15px;
    font-size: 21px;
    font-weight: 900;
}

.collection-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.collection-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 15px;
    padding: 12px;
    text-align: center;
    min-height: 145px;
}

.collection-icon {
    font-size: 42px;
    margin-bottom: 6px;
}

.collection-name {
    font-size: 14px;
    font-weight: bold;
}

.collection-rarity {
    color: #9f8bab;
    font-size: 10px;
    margin-top: 4px;
}

.collection-count {
    margin-top: 7px;
    color: #c95cff;
    font-size: 12px;
    font-weight: bold;
}

/* PROFILE */

.profile {
    text-align: center;
}

.profile-avatar {
    width: 100px;
    height: 100px;
    margin: 10px auto 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 50px;

    background: linear-gradient(145deg, #56218a, #160b27);

    border: 2px solid rgba(190,80,255,0.5);

    box-shadow: 0 0 30px rgba(160,50,255,0.2);
}

.profile-name {
    font-size: 24px;
    font-weight: 900;
}

.profile-label {
    color: #8e7c9e;
    font-size: 11px;
    margin-top: 4px;
}

.profile-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 25px;
}

.stat {
    background: rgba(255,255,255,0.06);
    border-radius: 15px;
    padding: 18px 10px;
}

.stat-number {
    font-size: 25px;
    font-weight: 900;
}

.stat-label {
    color: #91829d;
    font-size: 11px;
    margin-top: 5px;
}

/* RARITIES */

.rarity-COMMON {
    color: #cfcfcf;
}

.rarity-UNCOMMON {
    color: #45e879;
}

.rarity-RARE {
    color: #52a9ff;
}

.rarity-EPIC {
    color: #b45cff;
}

.rarity-LEGENDARY {
    color: #ffd84d;
}

.rarity-MYTHIC {
    color: #ff5252;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">SAYSEI CARDUNIVERSE</div>
        <div class="subtitle">COLLECT YOUR DESTINY</div>
    </div>

    <div class="balance">
        💰 <span id="coins">1000</span>
    </div>

    <!-- MENU -->

    <div class="menu">

        <button id="gameButton" class="active">
            🎁 ПАК
        </button>

        <button id="collectionButton" class="inactive">
            🃏 КОЛЛЕКЦИЯ
        </button>

        <button id="profileButton" class="inactive">
            👤 ПРОФИЛЬ
        </button>

    </div>


    <!-- GAME -->

    <div id="gameSection" class="section active">

        <div id="card" class="card">

            <div id="cardArt" class="card-art">
                🌙
            </div>

            <div id="cardId" class="card-id">
                #001
            </div>

            <div id="cardRarity" class="rarity rarity-MYTHIC">
                MYTHIC
            </div>

            <div id="cardName" class="card-name">
                SaySei
            </div>

            <div id="cardRole" class="card-role">
                Главная героиня
            </div>

            <div id="cardChance" class="card-chance">
                Шанс: 0.05%
            </div>

        </div>

        <button id="openButton" class="open-button">
            🎁 ОТКРЫТЬ ПАК — 100 💰
        </button>

    </div>


    <!-- COLLECTION -->

    <div id="collectionSection" class="section">

        <div class="collection-title">
            🃏 МОЯ КОЛЛЕКЦИЯ
        </div>

        <div id="collectionGrid" class="collection-grid"></div>

    </div>


    <!-- PROFILE -->

    <div id="profileSection" class="section">

        <div class="profile">

            <div class="profile-avatar">
                👤
            </div>

            <div class="profile-name">
                Игрок
            </div>

            <div class="profile-label">
                SAYSEI CARDUNIVERSE
            </div>

            <div class="profile-stats">

                <div class="stat">
                    <div id="profileCards" class="stat-number">
                        0
                    </div>

                    <div class="stat-label">
                        КАРТ СОБРАНО
                    </div>
                </div>

                <div class="stat">
                    <div id="profileCoins" class="stat-number">
                        1000
                    </div>

                    <div class="stat-label">
                        МОНЕТ
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   ДАННЫЕ ИГРОКА
========================================= */

let coins = Number(
    localStorage.getItem("saysei_coins")
);

if (!Number.isFinite(coins)) {
    coins = 1000;
}


let collection;

try {

    collection = JSON.parse(
        localStorage.getItem("saysei_collection")
    );

    if (!collection || typeof collection !== "object") {
        collection = {};
    }

} catch (error) {

    collection = {};

}


/* =========================================
   КАРТЫ
========================================= */

const cards = [

    {
        id: 1,
        name: "SaySei",
        rarity: "MYTHIC",
        chance: 0.05,
        icon: "🌙",
        role: "Главная героиня"
    },

    {
        id: 2,
        name: "iseedeadsouls",
        rarity: "MYTHIC",
        chance: 0.01,
        icon: "👁️",
        role: "Создатель вселенной"
    },

    {
        id: 3,
        name: "Странник",
        rarity: "COMMON",
        chance: 19.98,
        icon: "⚪",
        role: "Житель вселенной"
    },

    {
        id: 4,
        name: "Новичок",
        rarity: "COMMON",
        chance: 19.98,
        icon: "⚪",
        role: "Житель вселенной"
    },

    {
        id: 5,
        name: "Охотник",
        rarity: "COMMON",
        chance: 19.98,
        icon: "⚪",
        role: "Охотник"
    },

    {
        id: 6,
        name: "Воин",
        rarity: "UNCOMMON",
        chance: 8.33,
        icon: "🟢",
        role: "Воин"
    },

    {
        id: 7,
        name: "Разведчик",
        rarity: "UNCOMMON",
        chance: 8.33,
        icon: "🟢",
        role: "Разведчик"
    },

    {
        id: 8,
        name: "Маг",
        rarity: "UNCOMMON",
        chance: 8.33,
        icon: "🟢",
        role: "Маг"
    },

    {
        id: 9,
        name: "Аскеладд",
        rarity: "RARE",
        chance: 1.66,
        icon: "🔵",
        role: "Стратег"
    },

    {
        id: 10,
        name: "Денджи",
        rarity: "RARE",
        chance: 1.66,
        icon: "🔵",
        role: "Охотник на демонов"
    },

    {
        id: 11,
        name: "Клинок",
        rarity: "RARE",
        chance: 1.68,
        icon: "🔵",
        role: "Воин"
    },

    {
        id: 12,
        name: "Макима",
        rarity: "EPIC",
        chance: 0.44,
        icon: "🟣",
        role: "Контроль"
    },

    {
        id: 13,
        name: "Демон",
        rarity: "EPIC",
        chance: 0.44,
        icon: "🟣",
        role: "Сущность"
    },

    {
        id: 14,
        name: "Повелитель",
        rarity: "EPIC",
        chance: 0.45,
        icon: "🟣",
        role: "Властитель"
    },

    {
        id: 15,
        name: "Бог войны",
        rarity: "LEGENDARY",
        chance: 0.12,
        icon: "🟡",
        role: "Божественная сущность"
    },

    {
        id: 16,
        name: "Король мира",
        rarity: "LEGENDARY",
        chance: 0.12,
        icon: "🟡",
        role: "Верховный правитель"
    },

    {
        id: 17,
        name: "Избранный",
        rarity: "LEGENDARY",
        chance: 0.12,
        icon: "🟡",
        role: "Избранный"
    },

    {
        id: 18,
        name: "???",
        rarity: "MYTHIC",
        chance: 0.01,
        icon: "🔴",
        role: "Неизвестно"
    }

];


/* =========================================
   СОХРАНЕНИЕ
========================================= */

function saveGame() {

    localStorage.setItem(
        "saysei_coins",
        String(coins)
    );

    localStorage.setItem(
        "saysei_collection",
        JSON.stringify(collection)
    );

}


/* =========================================
   БАЛАНС
========================================= */

function updateCoins() {

    document.getElementById("coins").textContent = coins;

}


/* =========================================
   СЛУЧАЙНАЯ КАРТА
========================================= */

function getRandomCard() {

    const random = Math.random() * 100;

    let current = 0;

    for (const card of cards) {

        current += card.chance;

        if (random < current) {
            return card;
        }

    }

    return cards[cards.length - 1];

}


/* =========================================
   ОТКРЫТИЕ ПАКА
========================================= */

function openPack() {

    if (coins < 100) {

        alert("Недостаточно монет!");

        return;

    }


    coins -= 100;

    updateCoins();

    saveGame();


    const button =
        document.getElementById("openButton");

    const card =
        document.getElementById("card");


    button.disabled = true;


    card.classList.add("opening");


    document.getElementById("cardArt").textContent = "✨";

    document.getElementById("cardId").textContent = "#???";

    document.getElementById("cardRarity").textContent = "OPENING";

    document.getElementById("cardRarity").className = "rarity";

    document.getElementById("cardName").textContent =
        "Открываем...";

    document.getElementById("cardRole").textContent =
        "Определяем судьбу...";

    document.getElementById("cardChance").textContent =
        "Определяем карту...";


    setTimeout(function() {

        const result = getRandomCard();


        document.getElementById("cardArt").textContent =
            result.icon;

        document.getElementById("cardId").textContent =
            "#" + String(result.id).padStart(3, "0");

        document.getElementById("cardRarity").textContent =
            result.rarity;

        document.getElementById("cardRarity").className =
            "rarity rarity-" + result.rarity;

        document.getElementById("cardName").textContent =
            result.name;

        document.getElementById("cardRole").textContent =
            result.role;

        document.getElementById("cardChance").textContent =
            "Шанс: " + result.chance + "%";


        if (!collection[result.id]) {

            collection[result.id] = {
                count: 0
            };

        }


        collection[result.id].count++;


        saveGame();


        card.classList.remove("opening");

        button.disabled = false;


        renderCollection();

        updateProfile();


    }, 1200);

}


/* =========================================
   МЕНЮ
========================================= */

function showSection(section) {

    const sections = [
        "gameSection",
        "collectionSection",
        "profileSection"
    ];

    sections.forEach(function(id) {

        document
            .getElementById(id)
            .classList.remove("active");

    });


    const buttons = [
        "gameButton",
        "collectionButton",
        "profileButton"
    ];

    buttons.forEach(function(id) {

        document
            .getElementById(id)
            .className = "inactive";

    });


    if (section === "game") {

        document
            .getElementById("gameSection")
            .classList.add("active");

        document
            .getElementById("gameButton")
            .className = "active";

    }


    if (section === "collection") {

        document
            .getElementById("collectionSection")
            .classList.add("active");

        document
            .getElementById("collectionButton")
            .className = "active";

        renderCollection();

    }


    if (section === "profile") {

        document
            .getElementById("profileSection")
            .classList.add("active");

        document
            .getElementById("profileButton")
            .className = "active";

        updateProfile();

    }

}


/* =========================================
   КОЛЛЕКЦИЯ
========================================= */

function renderCollection() {

    const grid =
        document.getElementById("collectionGrid");


    grid.innerHTML = "";


    cards.forEach(function(card) {

        const owned =
            collection[card.id] &&
            collection[card.id].count > 0;


        const element =
            document.createElement("div");


        element.className = "collection-card";


        if (owned) {

            element.innerHTML = `

                <div class="collection-icon">
                    ${card.icon}
                </div>

                <div class="collection-name">
                    ${card.name}
                </div>

                <div class="collection-rarity">
                    ${card.rarity}
                </div>

                <div class="collection-count">
                    ×${collection[card.id].count}
                </div>

            `;

        } else {

            element.innerHTML = `

                <div class="collection-icon">
                    ❓
                </div>

                <div class="collection-name">
                    ???
                </div>

                <div class="collection-rarity">
                    UNKNOWN
                </div>

                <div class="collection-count">
                    Не получена
                </div>

            `;

        }


        grid.appendChild(element);

    });

}


/* =========================================
   ПРОФИЛЬ
========================================= */

function updateProfile() {

    let collected = 0;


    cards.forEach(function(card) {

        if (
            collection[card.id] &&
            collection[card.id].count > 0
        ) {

            collected++;

        }

    });


    document.getElementById(
        "profileCards"
    ).textContent = collected;


    document.getElementById(
        "profileCoins"
    ).textContent = coins;

}


/* =========================================
   ПОДКЛЮЧАЕМ КНОПКИ
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        document
            .getElementById("openButton")
            .addEventListener(
                "click",
                openPack
            );


        document
            .getElementById("gameButton")
            .addEventListener(
                "click",
                function() {
                    showSection("game");
                }
            );


        document
            .getElementById("collectionButton")
            .addEventListener(
                "click",
                function() {
                    showSection("collection");
                }
            );


        document
            .getElementById("profileButton")
            .addEventListener(
                "click",
                function() {
                    showSection("profile");
                }
            );


        updateCoins();

        renderCollection();

        updateProfile();

    }
);

</script>

</body>
</html>
