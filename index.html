<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SaySei CardUniverse</title>

<style>

/* =========================
   ОСНОВА
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            #40306e 0%,
            #171326 35%,
            #07070c 75%
        );

    color: white;
    font-family: Arial, sans-serif;
}

.game {
    width: 100%;
    max-width: 430px;
    margin: auto;

    padding: 22px 16px 40px;
}


/* =========================
   ЛОГО
========================= */

.logo {
    text-align: center;

    font-size: 29px;
    font-weight: 900;

    letter-spacing: 3px;
}

.subtitle {
    text-align: center;

    color: #999;

    font-size: 13px;

    letter-spacing: 4px;

    margin-top: 4px;
}


/* =========================
   БАЛАНС
========================= */

.balance {
    margin: 22px 0;

    padding: 12px;

    border-radius: 14px;

    background: rgba(255,255,255,.06);

    border:
        1px solid
        rgba(255,255,255,.07);

    color: #ffd95a;

    text-align: center;

    font-size: 18px;

    font-weight: bold;
}


/* =========================
   НАВИГАЦИЯ
========================= */

.menu {
    display: flex;

    gap: 9px;

    margin-bottom: 20px;
}

.menu button {
    flex: 1;

    margin-top: 0;

    padding: 12px 6px;

    font-size: 12px;

    border-radius: 12px;

    box-shadow: none;
}

.menu .active {
    background:
        linear-gradient(
            135deg,
            #7655ff,
            #5131d1
        );

    border-color: transparent;
}

.menu .inactive {
    background:
        rgba(255,255,255,.05);

    border:
        1px solid
        rgba(255,255,255,.1);

    color: #aaa;

    box-shadow: none;
}


/* =========================
   СЕКЦИИ
========================= */

.section {
    display: none;
}

.section.active {
    display: block;
}


/* =========================
   ОСНОВНАЯ КАРТА
========================= */

.card {
    position: relative;

    height: 470px;

    overflow: hidden;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #29283b,
            #0d0d15
        );

    border:
        2px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.65);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-end;

    padding: 25px;

    transition: .3s;
}

.card::before {
    content: "";

    position: absolute;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background:
        rgba(120,80,255,.18);

    filter: blur(60px);

    top: -100px;
}

.card-art {
    position: absolute;

    top: 25px;
    left: 25px;
    right: 25px;

    height: 300px;

    border-radius: 20px;

    background:
        radial-gradient(
            circle at 50% 35%,
            #514d76,
            #242238 45%,
            #101019 100%
        );

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.1);
}

.card-art-symbol {
    font-size: 115px;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(0,0,0,.6)
        );
}

.card-id {
    position: absolute;

    top: 12px;
    left: 14px;

    padding: 5px 9px;

    border-radius: 8px;

    background:
        rgba(0,0,0,.55);

    font-size: 12px;

    color: #bbb;
}

.card-rarity {
    position: absolute;

    top: 12px;
    right: 14px;

    padding: 5px 9px;

    border-radius: 8px;

    background:
        rgba(0,0,0,.55);

    font-size: 11px;

    font-weight: bold;
}

.card-name {
    position: relative;

    font-size: 27px;

    font-weight: 900;

    margin-top: 10px;

    text-align: center;
}

.card-role {
    position: relative;

    color: #aaa;

    font-size: 12px;

    margin-top: 5px;

    letter-spacing: 1px;

    text-transform: uppercase;

    text-align: center;
}

.card-chance {
    position: relative;

    color: #777;

    font-size: 12px;

    margin-top: 8px;
}


/* =========================
   КНОПКИ
========================= */

button {
    width: 100%;

    margin-top: 14px;

    padding: 17px;

    border: none;

    border-radius: 15px;

    color: white;

    font-size: 17px;

    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            #7655ff,
            #5131d1
        );

    box-shadow:
        0 8px 25px
        rgba(100,70,255,.3);
}

button:active {
    transform: scale(.97);
}

button:disabled {
    opacity: .5;
}


/* =========================
   КОЛЛЕКЦИЯ
========================= */

.collection-title {
    font-size: 24px;

    font-weight: 900;

    margin-bottom: 5px;
}

.collection-subtitle {
    color: #777;

    font-size: 13px;

    margin-bottom: 17px;
}

.collection-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;
}

.collection-card {
    position: relative;

    min-height: 220px;

    padding: 10px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            #20202e,
            #101016
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    overflow: hidden;
}

.collection-art {
    height: 135px;

    border-radius: 13px;

    background:
        radial-gradient(
            circle,
            #45425f,
            #15151e
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 55px;
}

.collection-number {
    position: absolute;

    top: 17px;
    left: 17px;

    background:
        rgba(0,0,0,.6);

    padding: 3px 6px;

    border-radius: 5px;

    font-size: 10px;

    color: #aaa;
}

.collection-name {
    margin-top: 9px;

    font-size: 14px;

    font-weight: bold;
}

.collection-rarity {
    margin-top: 4px;

    font-size: 10px;

    font-weight: bold;
}

.collection-count {
    margin-top: 5px;

    color: #888;

    font-size: 11px;
}

.unknown {
    opacity: .4;
}

.unknown .collection-art {
    filter: grayscale(1);
}

.unknown .collection-name {
    color: #666;
}


/* =========================
   ПРОФИЛЬ
========================= */

.profile-box {
    padding: 25px 20px;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #20202e,
            #101016
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    text-align: center;
}

.profile-avatar {
    width: 85px;
    height: 85px;

    margin: 0 auto 15px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #7655ff,
            #25174d
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 40px;

    box-shadow:
        0 0 35px
        rgba(120,80,255,.35);
}

.profile-name {
    font-size: 23px;

    font-weight: 900;
}

.profile-label {
    color: #777;

    font-size: 12px;

    margin-top: 5px;
}

.profile-stats {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin-top: 22px;
}

.profile-stat {
    padding: 15px 8px;

    border-radius: 14px;

    background:
        rgba(255,255,255,.04);
}

.profile-stat-number {
    font-size: 20px;

    font-weight: bold;
}

.profile-stat-label {
    margin-top: 4px;

    color: #777;

    font-size: 11px;
}


/* =========================
   РЕДКОСТИ
========================= */

.common {
    color: #aaa;
}

.uncommon {
    color: #52d273;
}

.rare {
    color: #54a8ff;
}

.epic {
    color: #b66cff;
}

.legendary {
    color: #ffd43b;
}

.mythic {
    color: #ff4b5c;

    text-shadow:
        0 0 15px
        rgba(255,60,80,.8);
}


/* =========================
   ЭФФЕКТЫ КАРТ
========================= */

.card.common {
    border-color: #555;
}

.card.uncommon {
    border-color: #35b85c;
}

.card.rare {
    border-color: #428de0;

    box-shadow:
        0 0 30px
        rgba(70,150,255,.25),

        0 25px 70px
        rgba(0,0,0,.6);
}

.card.epic {
    border-color: #984cff;

    box-shadow:
        0 0 40px
        rgba(160,70,255,.3),

        0 25px 70px
        rgba(0,0,0,.6);
}

.card.legendary {
    border-color: #e8bb22;

    box-shadow:
        0 0 50px
        rgba(255,210,50,.3),

        0 25px 70px
        rgba(0,0,0,.6);
}

.card.mythic {
    border-color: #ff334f;

    box-shadow:
        0 0 60px
        rgba(255,40,70,.4),

        0 25px 70px
        rgba(0,0,0,.6);
}


/* =========================
   CREATOR
========================= */

.card.creator {
    border-color: #ffffff;

    box-shadow:
        0 0 70px
        rgba(255,255,255,.45),

        0 25px 70px
        rgba(0,0,0,.7);
}

.creator-text {
    color: white;
}


/* =========================
   АНИМАЦИЯ
========================= */

.opening {
    animation:
        shake .45s infinite;
}

@keyframes shake {

    0% {
        transform: rotate(0);
    }

    25% {
        transform: rotate(2deg);
    }

    50% {
        transform: rotate(0);
    }

    75% {
        transform: rotate(-2deg);
    }

    100% {
        transform: rotate(0);
    }

}

</style>

</head>


<body>

<div class="game">


    <!-- LOGO -->

    <div class="logo">
        🎴 SAYSEI
    </div>

    <div class="subtitle">
        CARD UNIVERSE
    </div>

        💰 <span id="coins">1000</span>
    </div>

    <div class="menu">

        <button
            id="menuGame"
            class="active"
            onclick="showSection('game')"
        >
            🎁 ПАК
        </button>

        <button
            id="menuCollection"

            onclick="showSection('collection')"
        >
            🃏 КОЛЛЕКЦИЯ
        </button>

        <button
            id="menuProfile"
            class="inactive"
            onclick="showSection('profile')"
        >
            👤 ПРОФИЛЬ

    <!-- =========================
         ИГРА
    ========================== -->

    <div
        class="section active"

    >

        <div
            class="card"
            id="card"
        >

            <div class="card-art">

                <div
                    class="card-id"
                    id="cardId"
                >
                    #???
                </div>

                <div
                    class="card-rarity"

                >
                    CARD
                </div>

                    class="card-art-symbol"

            </div>


            <div
                class="card-name"
                id="name"
            >
                Открой свой пак
            </div>


            <div
                class="card-role"
                id="role"
            >
                SAYSEI CARDUNIVERSE
            </div>


            <div
                class="card-chance"
                id="chance"
            >
                Стоимость: 100 💰
            </div>

        </div>


        <button
            onclick="openPack()"
            id="openButton"
        >
            🎁 ОТКРЫТЬ ПАК — 100 💰
        </button>

    </div>


    <!-- =========================
         КОЛЛЕКЦИЯ
    ========================== -->

    <div
        class="section"
        id="collectionSection"
    >

        <div class="collection-title">
            🃏 Коллекция
        </div>

        <div class="collection-subtitle">

            Собрано:
            <span id="collectionCount">
                0
            </span>
            / 18

        </div>


        <div
            class="collection-grid"
            id="collectionGrid"
        ></div>

    </div>


    <!-- =========================
         ПРОФИЛЬ
    ========================== -->

    <div
        class="section"
        id="profileSection"
    >

        <div class="profile-box">

            <div class="profile-avatar">
                👤
            </div>

            <div class="profile-name">
                Игрок
            </div>

            <div class="profile-label">
                SAYSEI CARDUNIVERSE
            </div>


            <div class="profile-stats">

                <div class="profile-stat">

                    <div
                        class="profile-stat-number"
                        id="profileCards"
                    >
                        0
                    </div>

                    <div class="profile-stat-label">
                        КАРТ СОБРАНО
                    </div>

                </div>


                <div class="profile-stat">

                    <div
                        class="profile-stat-number"
                        id="profileCoins"
                    >
                        0
                    </div>

                    <div class="profile-stat-label">
                        МОНЕТ
                    </div>

                </div>

            </div>

        </div>

    </div>


</div>


<script>


/* =========================
   СОХРАНЕНИЕ
========================= */

let coins =
    Number(
        localStorage.getItem(
            "saysei_coins"
        )
    ) || 1000;


let collection =
    JSON.parse(
        localStorage.getItem(
            "saysei_collection"
        )
    ) || {};


/* =========================
   КАРТЫ
========================= */

const cards = [

    {
        id: 1,
        name: "SaySei",
        rarity: "MYTHIC",
        chance: 0.05,
        icon: "🌙",
        class: "mythic",
        role: "Главная героиня"
    },

    {
        id: 2,
        name: "iseedeadsouls",
        rarity: "MYTHIC",
        chance: 0.01,
        icon: "👁️",
        class: "creator",
        role: "Создатель вселенной"
    },

    {
        id: 3,
        name: "Странник",
        rarity: "COMMON",
        chance: 19.98,

        class: "common",

    },

    {
        id: 4,
        name: "Новичок",
        rarity: "COMMON",
        chance: 19.98,
        icon: "⚪",
        class: "common",
        role: "Житель вселенной"
    },

    {
        id: 5,
        name: "Охотник",
        rarity: "COMMON",
        chance: 19.98,
        icon: "⚪",
        class: "common",
        role: "Охотник"
    },

    {
        id: 6,
        name: "Воин",
        rarity: "UNCOMMON",
        chance: 8.33,
        icon: "🟢",
        class: "uncommon",
        role: "Воин"
    },

    {
        id: 7,
        name: "Разведчик",
        rarity: "UNCOMMON",
        chance: 8.33,
        icon: "🟢",
        class: "uncommon",
        role: "Разведчик"
    },

    {
        id: 8,
        name: "Маг",
        rarity: "UNCOMMON",
        chance: 8.33,
        icon: "🟢",
        class: "uncommon",
        role: "Маг"
    },

    {
        id: 9,
        name: "Аскеладд",
        rarity: "RARE",
        chance: 1.66,
        icon: "🔵",
        class: "rare",
        role: "Стратег"
    },

    {
        id: 10,

        rarity: "RARE",
        chance: 1.66,

        class: "rare",
        role: "Охотник на демонов"
    },

    {
        id: 11,

        rarity: "RARE",
        chance: 1.68,
        icon: "🔵",
        class: "rare",
        role: "Воин"
    },

    {
        id: 12,
        name: "Макима",
        rarity: "EPIC",

        class: "epic",
        role: "Контроль"
    },

    {

        name: "Демон",

    },

    {
        id: 14,
        name: "Повелитель",

        chance: 0.45,
        icon: "🟣",
        class: "epic",

    },

    {
        id: 15,

        rarity: "LEGENDARY",
        chance: 0.12,
        icon: "🟡",
        class: "legendary",
        role: "Божественная сущность"
    },

    {
        id: 16,
        name: "Король мира",
        rarity: "LEGENDARY",
        chance: 0.12,

        class: "legendary",
        role: "Верховный правитель"
    },

    {
        id: 17,
        name: "Избранный",

        chance: 0.12,
        icon: "🟡",
        class: "legendary",
        role: "Избранный"
    },

    {
        id: 18,
        name: "???",
        rarity: "MYTHIC",
        chance: 0.01,
        icon: "🔴",
        class: "mythic",
        role: "Неизвестно"
    }

];


/* =========================
   СОХРАНИТЬ ДАННЫЕ
========================= */

function saveData() {

    localStorage.setItem(
        "saysei_coins",
        coins
    );

    localStorage.setItem(
        "saysei_collection",
        JSON.stringify(collection)
    );

}


/* =========================
   ПЕРЕКЛЮЧЕНИЕ РАЗДЕЛОВ
========================= */

function showSection(section) {

    const game =
        document.getElementById(
            "gameSection"
        );

    const collectionSection =
        document.getElementById(
            "collectionSection"
        );

    const profile =
        document.getElementById(
            "profileSection"
        );


    const menuGame =
        document.getElementById(
            "menuGame"
        );

    const menuCollection =
        document.getElementById(
            "menuCollection"
        );

    const menuProfile =
        document.getElementById(
            "menuProfile"
        );


    game.classList.remove("active");

    collectionSection.classList.remove(
        "active"
    );

    profile.classList.remove(
        "active"
    );


    menuGame.className = "inactive";

    menuCollection.className =
        "inactive";

    menuProfile.className =
        "inactive";


    if (section === "game") {

        game.classList.add("active");

        menuGame.className = "active";

    }


    if (section === "collection") {

        collectionSection.classList.add(
            "active"
        );

        menuCollection.className =
            "active";

        renderCollection();

    }


    if (section === "profile") {

        profile.classList.add("active");

        menuProfile.className =
            "active";

        updateProfile();

    }

}


/* =========================
   СЛУЧАЙНАЯ КАРТА
========================= */

function getRandomCard() {

    let random =
        Math.random() * 100;

    let current = 0;


    for (const card of cards) {

        current += card.chance;

        if (random < current) {

            return card;

        }

    }


    return cards[2];

}


/* =========================
   ОТКРЫТИЕ ПАКА
========================= */

function openPack() {

    if (coins < 100) {

        alert(
            "Недостаточно монет!"
        );

        return;

    }


    const button =
        document.getElementById(
            "openButton"
        );


    const cardElement =
        document.getElementById(
            "card"
        );


    coins -= 100;


    document.getElementById(
        "coins"
    ).textContent = coins;


    saveData();


    button.disabled = true;


    cardElement.className =
        "card opening";


    document.getElementById(
        "icon"
    ).textContent = "✨";


    document.getElementById(
        "cardId"
    ).textContent = "#???";


    document.getElementById(
        "cardRarity"
    ).textContent = "OPENING";


    document.getElementById(
        "name"
    ).textContent =
