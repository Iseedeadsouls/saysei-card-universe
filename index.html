<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SaySei CardUniverse</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #29234d 0%, #0d0b16 45%, #07070c 100%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
}

.game {
    width: 100%;
    max-width: 430px;
    padding: 25px 18px;
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-top: 4px;
}

.balance {
    margin: 25px 0 15px;
    padding: 12px;
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
    color: #ffd95a;
    font-size: 18px;
    text-align: center;
}

.card {
    height: 360px;
    border-radius: 24px;
    background: linear-gradient(145deg, #222235, #11111b);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: 0.3s;
}

.card-icon {
    font-size: 100px;
    margin-bottom: 25px;
}

.card-name {
    font-size: 25px;
    font-weight: bold;
    text-align: center;
}

.rarity {
    margin-top: 12px;
    font-size: 18px;
    font-weight: bold;
}

.chance {
    margin-top: 7px;
    color: #999;
    font-size: 13px;
}

button {
    margin-top: 15px;
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #7655ff, #5435d6);
    color: white;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 8px 25px rgba(100,70,255,0.35);
}

button:active {
    transform: scale(0.97);
}

button:disabled {
    opacity: 0.5;
}

.collection-button {
    background: linear-gradient(135deg, #252538, #171724);
    box-shadow: none;
    border: 1px solid rgba(255,255,255,0.1);
}

.collection {
    display: none;
    margin-top: 25px;
}

.collection-title {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 15px;
}

.collection-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.collection-card {
    padding: 18px 10px;
    border-radius: 18px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    text-align: center;
}

.collection-icon {
    font-size: 45px;
}

.collection-name {
    margin-top: 8px;
    font-weight: bold;
}

.collection-rarity {
    font-size: 12px;
    margin-top: 5px;
}

.collection-count {
    margin-top: 8px;
    color: #aaa;
    font-size: 13px;
}

.common {
    color: #aaa;
}

.uncommon {
    color: #52d273;
}

.rare {
    color: #54a8ff;
}

.epic {
    color: #b66cff;
}

.legendary {
    color: #ffd43b;
}

.mythic {
    color: #ff4b5c;
    text-shadow: 0 0 15px rgba(255,60,80,0.8);
}

.opening {
    animation: shake 0.5s infinite;
}

@keyframes shake {

    0% {
        transform: rotate(0deg);
    }

    25% {
        transform: rotate(2deg);
    }

    50% {
        transform: rotate(0deg);
    }

    75% {
        transform: rotate(-2deg);
    }

    100% {
        transform: rotate(0deg);
    }

}

</style>
</head>

<body>

<div class="game">

    <div class="logo">
        🎴 SAYSEI
    </div>

    <div class="subtitle">
        CARD UNIVERSE
    </div>


    <div class="balance">
        💰 <span id="coins">1000</span>
    </div>


    <div class="card" id="card">

        <div class="card-icon" id="icon">
            🎁
        </div>

        <div class="card-name" id="name">
            Открой свой пак
        </div>

        <div class="rarity" id="rarity">
            ?
        </div>

        <div class="chance" id="chance">
            Стоимость: 100 💰
        </div>

    </div>


    <button onclick="openPack()" id="openButton">
        🎁 ОТКРЫТЬ ПАК — 100 💰
    </button>


    <button
        class="collection-button"
        onclick="toggleCollection()"
        id="collectionButton"
    >
        🃏 МОЯ КОЛЛЕКЦИЯ
    </button>


    <div class="collection" id="collection">

        <div class="collection-title">
            🃏 Моя коллекция
        </div>

        <div class="collection-grid" id="collectionGrid"></div>

    </div>

</div>


<script>

let coins = Number(localStorage.getItem("saysei_coins")) || 1000;

let collection =
    JSON.parse(localStorage.getItem("saysei_collection")) || {};


const rarities = [

    {
        name: "COMMON",
        chance: 60,
        class: "common",
        cards: [
            "Странник",
            "Новичок",
            "Охотник"
        ]
    },

    {
        name: "UNCOMMON",
        chance: 25,
        class: "uncommon",
        cards: [
            "Воин",
            "Разведчик",
            "Маг"
        ]
    },

    {
        name: "RARE",
        chance: 10,
        class: "rare",
        cards: [
            "Аскеладд",
            "Денджи",
            "Клинок"
        ]
    },

    {
        name: "EPIC",
        chance: 4,
        class: "epic",
        cards: [
            "Макима",
            "Демон",
            "Повелитель"
        ]
    },

    {
        name: "LEGENDARY",
        chance: 0.9,
        class: "legendary",
        cards: [
            "Бог войны",
            "Король мира",
            "Избранный"
        ]
    },

    {
        name: "MYTHIC",
        chance: 0.1,
        class: "mythic",
        cards: [
            "???",
            "Абсолют",
            "Верховный"
        ]
    }

];


function getRarity() {

    const random = Math.random() * 100;

    let current = 0;

    for (const rarity of rarities) {

        current += rarity.chance;

        if (random < current) {
            return rarity;
        }

    }

    return rarities[0];
}


function getIcon(rarity) {

    switch (rarity) {

        case "COMMON":
            return "⚪";

        case "UNCOMMON":
            return "🟢";

        case "RARE":
            return "🔵";

        case "EPIC":
            return "🟣";

        case "LEGENDARY":
            return "🟡";

        case "MYTHIC":
            return "🔴";

        default:
            return "🎴";

    }

}


function saveData() {

    localStorage.setItem(
        "saysei_coins",
        coins
    );

    localStorage.setItem(
        "saysei_collection",
        JSON.stringify(collection)
    );

}


function addToCollection(cardName, rarity) {

    const id = rarity.name + "_" + cardName;

    if (!collection[id]) {

        collection[id] = {
            name: cardName,
            rarity: rarity.name,
            class: rarity.class,
            count: 0
        };

    }

    collection[id].count++;

    saveData();

}


function openPack() {

    if (coins < 100) {

        alert("Недостаточно монет!");

        return;
    }


    const button =
        document.getElementById("openButton");

    const card =
        document.getElementById("card");


    coins -= 100;

    document.getElementById("coins").textContent =
        coins;


    saveData();


    button.disabled = true;

    card.classList.add("opening");


    document.getElementById("icon").textContent =
        "✨";

    document.getElementById("name").textContent =
        "Открываем...";

    document.getElementById("rarity").textContent =
        "";

    document.getElementById("chance").textContent =
        "Определяем редкость...";


    setTimeout(() => {

        const rarity = getRarity();

        const randomCard =
            rarity.cards[
                Math.floor(
                    Math.random() *
                    rarity.cards.length
                )
            ];


        addToCollection(
            randomCard,
            rarity
        );


        document.getElementById("icon").textContent =
            getIcon(rarity.name);


        document.getElementById("name").textContent =
            randomCard;


        const rarityElement =
            document.getElementById("rarity");


        rarityElement.textContent =
            "✦ " + rarity.name + " ✦";


        rarityElement.className =
            "rarity " + rarity.class;


        document.getElementById("chance").textContent =
            "Шанс: " + rarity.chance + "%";


        card.classList.remove("opening");

        button.disabled = false;


        renderCollection();

    }, 1200);

}


function toggleCollection() {

    const collectionElement =
        document.getElementById("collection");

    const button =
        document.getElementById("collectionButton");


    if (
        collectionElement.style.display === "block"
    ) {

        collectionElement.style.display = "none";

        button.textContent =
            "🃏 МОЯ КОЛЛЕКЦИЯ";

    } else {

        collectionElement.style.display = "block";

        button.textContent =
            "🔽 СКРЫТЬ КОЛЛЕКЦИЮ";

        renderCollection();

    }

}


function renderCollection() {

    const grid =
        document.getElementById("collectionGrid");


    grid.innerHTML = "";


    const cards =
        Object.values(collection);


    if (cards.length === 0) {

        grid.innerHTML = `
            <div style="
                grid-column: 1 / -1;
                color: #888;
                padding: 30px;
            ">
                Коллекция пока пуста.<br>
                Открой свой первый пак!
            </div>
        `;

        return;
    }


    cards.forEach(card => {

        const element =
            document.createElement("div");


        element.className =
            "collection-card";


        element.innerHTML = `

            <div class="collection-icon">
                ${getIcon(card.rarity)}
            </div>

            <div class="collection-name">
                ${card.name}
            </div>

            <div class="collection-rarity ${card.class}">
                ✦ ${card.rarity} ✦
            </div>

            <div class="collection-count">
                Получено: x${card.count}
            </div>

        `;


        grid.appendChild(element);

    });

}


document.getElementById("coins").textContent =
    coins;


renderCollection();

</script>

</body>
</html>
