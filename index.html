<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SaySei CardUniverse</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            #40306e 0%,
            #171326 35%,
            #07070c 75%
        );

    color: white;
    font-family: Arial, sans-serif;
}

.game {
    width: 100%;
    max-width: 430px;
    margin: auto;
    padding: 22px 16px 40px;
}

.logo {
    text-align: center;
    font-size: 29px;
    font-weight: 900;
    letter-spacing: 3px;
}

.subtitle {
    text-align: center;
    color: #999;
    font-size: 13px;
    letter-spacing: 4px;
    margin-top: 4px;
}

.balance {
    margin: 22px 0;
    padding: 12px;

    border-radius: 14px;

    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.07);

    color: #ffd95a;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}


/* MAIN CARD */

.card {
    position: relative;

    height: 470px;

    overflow: hidden;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #29283b,
            #0d0d15
        );

    border: 2px solid rgba(255,255,255,.12);

    box-shadow:
        0 25px 70px rgba(0,0,0,.65);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: flex-end/* MAIN MENU */

.menu {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
}

.menu button {
    margin-top: 0;
}

.menu .collection-button {
    margin-top: 0;
}


/* MAIN CARD */;

    padding: 25px;

    transition: .3s;
}

.card::before {
    content: "";

    position: absolute;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background: rgba(120,80,255,.18);

    filter: blur(60px);

    top: -100px;
}

.card-art {
    position: absolute;

    top: 25px;
    left: 25px;
    right: 25px;

    height: 300px;

    border-radius: 20px;

    background:
        radial-gradient(
            circle at 50% 35%,
            #514d76,
            #242238 45%,
            #101019 100%
        );

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,.1);
}

.card-art-symbol {
    font-size: 115px;

    filter:
        drop-shadow(
            0 15px 25px rgba(0,0,0,.6)
        );
}

.card-id {
    position: absolute;

    top: 12px;
    left: 14px;

    padding: 5px 9px;

    border-radius: 8px;

    background: rgba(0,0,0,.55);

    font-size: 12px;

    color: #bbb;
}

.card-rarity {
    position: absolute;

    top: 12px;
    right: 14px;

    padding: 5px 9px;

    border-radius: 8px;

    background: rgba(0,0,0,.55);

    font-size: 11px;

    font-weight: bold;
}

.card-name {
    position: relative;

    font-size: 27px;
    font-weight: 900;

    margin-top: 10px;

    text-align: center;
}

.card-role {
    position: relative;

    color: #aaa;

    font-size: 12px;

    margin-top: 5px;

    letter-spacing: 1px;

    text-transform: uppercase;
}

.card-chance {
    position: relative;

    color: #777;

    font-size: 12px;

    margin-top: 8px;
}


/* BUTTONS */

button {
    width: 100%;

    margin-top: 14px;

    padding: 17px;

    border: none;

    border-radius: 15px;

    color: white;

    font-size: 17px;

    font-weight: bold;

    background:
        linear-gradient(
            135deg,
            #7655ff,
            #5131d1
        );

    box-shadow:
        0 8px 25px rgba(100,70,255,.3);
}

button:active {
    transform: scale(.97);
}

button:disabled {
    opacity: .5;
}

.collection-button {
    background:
        linear-gradient(
            135deg,
            #29283c,
            #151520
        );

    box-shadow: none;

    border: 1px solid rgba(255,255,255,.1);
}


/* COLLECTION */

.collection {
    display: none;

    margin-top: 28px;
}

.collection-title {
    font-size: 24px;

    font-weight: 900;

    margin-bottom: 5px;
}

.collection-subtitle {
    color: #777;

    font-size: 13px;

    margin-bottom: 17px;
}

.collection-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;
}

.collection-card {
    position: relative;

    min-height: 220px;

    padding: 10px;

    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            #20202e,
            #101016
        );

    border: 1px solid rgba(255,255,255,.08);

    overflow: hidden;
}

.collection-art {
    height: 135px;

    border-radius: 13px;

    background:
        radial-gradient(
            circle,
            #45425f,
            #15151e
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 55px;
}

.collection-number {
    position: absolute;

    top: 17px;
    left: 17px;

    background: rgba(0,0,0,.6);

    padding: 3px 6px;

    border-radius: 5px;

    font-size: 10px;

    color: #aaa;
}

.collection-name {
    margin-top: 9px;

    font-size: 14px;

    font-weight: bold;
}

.collection-rarity {
    margin-top: 4px;

    font-size: 10px;

    font-weight: bold;
}

.collection-count {
    margin-top: 5px;

    color: #888;

    font-size: 11px;
}

.unknown {
    opacity: .4;
}

.unknown .collection-art {
    filter: grayscale(1);
}

.unknown .collection-name {
    color: #666;
}


/* RARITIES */

.common {
    color: #aaa;
}

.uncommon {
    color: #52d273;
}

.rare {
    color: #54a8ff;
}

.epic {
    color: #b66cff;
}

.legendary {
    color: #ffd43b;
}

.mythic {
    color: #ff4b5c;

    text-shadow:
        0 0 15px rgba(255,60,80,.8);
}


/* CARD RARITY EFFECTS */

.card.common {
    border-color: #555;
}

.card.uncommon {
    border-color: #35b85c;
}

.card.rare {
    border-color: #428de0;

    box-shadow:
        0 0 30px rgba(70,150,255,.25),
        0 25px 70px rgba(0,0,0,.6);
}

.card.epic {
    border-color: #984cff;

    box-shadow:
        0 0 40px rgba(160,70,255,.3),
        0 25px 70px rgba(0,0,0,.6);
}

.card.legendary {
    border-color: #e8bb22;

    box-shadow:
        0 0 50px rgba(255,210,50,.3),
        0 25px 70px rgba(0,0,0,.6);
}

.card.mythic {
    border-color: #ff334f;

    box-shadow:
        0 0 60px rgba(255,40,70,.4),
        0 25px 70px rgba(0,0,0,.6);
}


/* CREATOR CARD */

.card.creator {
    border-color: #ffffff;

    box-shadow:
        0 0 70px rgba(255,255,255,.45),
        0 25px 70px rgba(0,0,0,.7);
}

.creator-text {
    color: white;
}


/* ANIMATION */

.opening {
    animation: shake .45s infinite;
}

@keyframes shake {

    0% {
        transform: rotate(0);
    }

    25% {
        transform: rotate(2deg);
    }

    50% {
        transform: rotate(0);
    }

    75% {
        transform: rotate(-2deg);
    }

    100% {
        transform: rotate(0);
    }

}

</style>

</head>


<body>


<div class="game">


    <div class="logo">
        🎴 SAYSEI
    </div>

    <div class="subtitle">
        CARD UNIVERSE
    </div>


    <div class="balance">
        💰 <span id="coins">1000</span>
    </div>
<div class="menu">

    <button onclick="showSection('game')">
        🎁 ОТКРЫТЬ ПАК
    </button>

    <button
        class="collection-button"
        onclick="showSection('collection')"
    >
        🃏 КОЛЛЕКЦИЯ
    </button>

    <button
        class="collection-button"
        onclick="showSection('profile')"
    >
        👤 ПРОФИЛЬ
    </button>

</div>

    <div class="card" id="card">


        <div class="card-art">

            <div class="card-id" id="cardId">
                #???
            </div>

            <div class="card-rarity" id="cardRarity">
                CARD
            </div>

            <div
                class="card-art-symbol"
                id="icon"
            >
                🎁
            </div>

        </div>


        <div class="card-name" id="name">
            Открой свой пак
        </div>


        <div
            class="card-role"
            id="role"
        >
            SAYSEI CARDUNIVERSE
        </div>


        <div
            class="card-chance"
            id="chance"
        >
            Стоимость: 100 💰
        </div>


    </div>


    <button
        onclick="openPack()"
        id="openButton"
    >
        🎁 ОТКРЫТЬ ПАК — 100 💰
    </button>


    <button
        class="collection-button"
        onclick="toggleCollection()"
        id="collectionButton"
    >
        🃏 МОЯ КОЛЛЕКЦИЯ
    </button>


    <div
        class="collection"
        id="collection"
    >

        <div class="collection-title">
            🃏 Коллекция
        </div>

        <div class="collection-subtitle">
            Собрано:
            <span id="collectionCount">
                0
            </span>
            / 18
        </div>

        <div
            class="collection-grid"
            id="collectionGrid"
        ></div>

    </div>


</div>


<script>


let coins =
    Number(
        localStorage.getItem(
            "saysei_coins"
        )
    ) || 1000;


let collection =
    JSON.parse(
        localStorage.getItem(
            "saysei_collection"
        )
    ) || {};


/*
    SAYSEI CARDUNIVERSE
    ОСНОВНЫЕ ПЕРСОНАЖИ:

    #001 SAYSEI
    #002 ISEEDEADSOULS

    Остальные персонажи пока
    являются частью первой коллекции.
*/


const cards = [

    {
        id: 1,
        name: "SaySei",
        rarity: "MYTHIC",
        chance: 0.05,
        icon: "🌙",
        class: "mythic",
        role: "Главная героиня"
    },

    {
        id: 2,
        name: "iseedeadsouls",
        rarity: "MYTHIC",
        chance: 0.01,
        icon: "👁️",
        class: "creator",
        role: "Создатель вселенной"
    },


    {
        id: 3,
        name: "Странник",
        rarity: "COMMON",
        chance: 19.98,
        icon: "⚪",
        class: "common",
        role: "Житель вселенной"
    },

    {
        id: 4,
        name: "Новичок",
        rarity: "COMMON",
        chance: 19.98,
        icon: "⚪",
        class: "common",
        role: "Житель вселенной"
    },

    {
        id: 5,
        name: "Охотник",
        rarity: "COMMON",
        chance: 19.98,
        icon: "⚪",
        class: "common",
        role: "Охотник"
    },


    {
        id: 6,
        name: "Воин",
        rarity: "UNCOMMON",
        chance: 8.33,
        icon: "🟢",
        class: "uncommon",
        role: "Воин"
    },

    {
        id: 7,
        name: "Разведчик",
        rarity: "UNCOMMON",
        chance: 8.33,
        icon: "🟢",
        class: "uncommon",
        role: "Разведчик"
    },

    {
        id: 8,
        name: "Маг",
        rarity: "UNCOMMON",
        chance: 8.33,
        icon: "🟢",
        class: "uncommon",
        role: "Маг"
    },


    {
        id: 9,
        name: "Аскеладд",
        rarity: "RARE",
        chance: 1.66,
        icon: "🔵",
        class: "rare",
        role: "Стратег"
    },

    {
        id: 10,
        name: "Денджи",
        rarity: "RARE",
        chance: 1.66,
        icon: "🔵",
        class: "rare",
        role: "Охотник на демонов"
    },

    {
        id: 11,
        name: "Клинок",
        rarity: "RARE",
        chance: 1.68,
        icon: "🔵",
        class: "rare",
        role: "Воин"
    },


    {
        id: 12,
        name: "Макима",
        rarity: "EPIC",
        chance: 0.44,
        icon: "🟣",
        class: "epic",
        role: "Контроль"
    },

    {
        id: 13,
        name: "Демон",
        rarity: "EPIC",
        chance: 0.44,
        icon: "🟣",
        class: "epic",
        role: "Сущность"
    },

    {
        id: 14,
        name: "Повелитель",
        rarity: "EPIC",
        chance: 0.45,
        icon: "🟣",
        class: "epic",
        role: "Властитель"
    },


    {
        id: 15,
        name: "Бог войны",
        rarity: "LEGENDARY",
        chance: 0.12,
        icon: "🟡",
        class: "legendary",
        role: "Божественная сущность"
    },

    {
        id: 16,
        name: "Король мира",
        rarity: "LEGENDARY",
        chance: 0.12,
        icon: "🟡",
        class: "legendary",
        role: "Верховный правитель"
    },

    {
        id: 17,
        name: "Избранный",
        rarity: "LEGENDARY",
        chance: 0.12,
        icon: "🟡",
        class: "legendary",
        role: "Избранный"
    },


    {
        id: 18,
        name: "???",
        rarity: "MYTHIC",
        chance: 0.01,
        icon: "🔴",
        class: "mythic",
        role: "Неизвестно"
    }

];


function saveData() {

    localStorage.setItem(
        "saysei_coins",
        coins
    );

    localStorage.setItem(
        "saysei_collection",
        JSON.stringify(collection)
    );

}


function getRandomCard() {

    let random =
        Math.random() * 100;

    let current = 0;


    for (const card of cards) {

        current += card.chance;

        if (random < current) {

            return card;

        }

    }


    return cards[2];

}


function openPack() {


    if (coins < 100) {

        alert(
            "Недостаточно монет!"
        );

        return;

    }


    const button =
        document.getElementById(
            "openButton"
        );


    const cardElement =
        document.getElementById(
            "card"
        );


    coins -= 100;


    document.getElementById(
        "coins"
    ).textContent = coins;


    saveData();


    button.disabled = true;


    cardElement.className =
        "card opening";


    document.getElementById(
        "icon"
    ).textContent = "✨";


    document.getElementById(
        "cardId"
    ).textContent = "#???";


    document.getElementById(
        "cardRarity"
    ).textContent = "OPENING";


    document.getElementById(
        "name"
    ).textContent =
        "Открываем...";


    document.getElementById(
        "role"
    ).textContent =
        "Определяем судьбу...";


    document.getElementById(
        "chance"
    ).textContent =
        "Определяем карту...";


    setTimeout(() => {


        const result =
            getRandomCard();


        document.getElementById(
            "icon"
        ).textContent =
            result.icon;


        document.getElementById(
            "cardId"
        ).textContent =
            "#" +
            String(result.id)
                .padStart(3, "0");


        document.getElementById(
            "cardRarity"
        ).textContent =
            result.rarity;


        document.getElementById(
            "name"
        ).textContent =
            result.name;


        document.getElementById(
            "role"
        ).textContent =
            result.role;


        document.getElementById(
            "chance"
        ).textContent =
            "Шанс выпадения: " +
            result.chance +
            "%";


        cardElement.className =
            "card " +
            result.class;


        if (!collection[result.id]) {

            collection[result.id] = {

                count: 0,

                name: result.name,

                rarity: result.rarity,

                class: result.class,

                role: result.role

            };

        }


        collection[result.id].count++;


        saveData();


        button.disabled = false;


        renderCollection();


    }, 1200);

}


function toggleCollection() {


    const element =
        document.getElementById(
            "collection"
        );


    const button =
        document.getElementById(
            "collectionButton"
        );


    if (
        element.style.display ===
        "block"
    ) {

        element.style.display =
            "none";


        button.textContent =
            "🃏 МОЯ КОЛЛЕКЦИЯ";


    } else {

        element.style.display =
            "block";


        button.textContent =
            "🔽 СКРЫТЬ КОЛЛЕКЦИЮ";


        renderCollection();

    }

}


function renderCollection() {


    const grid =
        document.getElementById(
            "collectionGrid"
        );


    grid.innerHTML = "";


    let collected = 0;


    cards.forEach(card => {


        const owned =
            collection[card.id];


        if (owned) {

            collected++;

        }


        const element =
            document.createElement(
                "div"
            );


        element.className =
            "collection-card " +
            (
                owned
                ? ""
                : "unknown"
            );


        element.innerHTML = `

            <div class="collection-art">

                ${
                    owned
                    ? card.icon
                    : "?"
                }

            </div>

            <div class="collection-number">

                #${String(card.id).padStart(3,"0")}

            </div>

            <div class="collection-name">

                ${
                    owned
                    ? card.name
                    : "???"
                }

            </div>

            <div class="collection-rarity ${card.class}">

                ${
                    owned
                    ? "✦ " + card.rarity + " ✦"
                    : "UNKNOWN"
                }

            </div>

            <div class="collection-count">

                ${
                    owned
                    ? "Получено: x" +
                      owned.count
                    : "Не получена"
                }

            </div>

        `;


        grid.appendChild(element);

    });


    document.getElementById(
        "collectionCount"
    ).textContent =
        collected;

}


document.getElementById(
    "coins"
).textContent = coins;


renderCollection();


</script>

</body>
</html>
